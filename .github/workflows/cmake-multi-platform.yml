name: CMake Build and Release (Windows + macOS)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., 1.0.0)'
        required: true
        default: '0.0.1'
      version_type:
        description: 'Version type (SNAPSHOT, DEMO, RELEASE)'
        required: true
        default: 'RELEASE'

env:
  PROJECT_NAME: Spektral

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        build_type: [Release]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Import macOS signing certificate
        working-directory: ./${{ env.PROJECT_NAME }}
        if: matrix.os == 'macos-latest'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12

          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Configure CMake
        working-directory: ./${{ env.PROJECT_NAME }}
        run: >
          cmake -B build
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DVERSION="${{ github.event.inputs.tag }}"
          -DVERSION_TYPE="${{ github.event.inputs.version_type }}"
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        working-directory: ./${{ env.PROJECT_NAME }}
        run: >
          cmake --build build --target ${{ env.PROJECT_NAME }} --config ${{ matrix.build_type }}

      - name: Build VST3
        working-directory: ./${{ env.PROJECT_NAME }}
        run: >
          cmake --build build --target ${{ env.PROJECT_NAME }}_VST3 --config ${{ matrix.build_type }}

      - name: Build Standalone
        working-directory: ./${{ env.PROJECT_NAME }}
        run: >
          cmake --build build --target ${{ env.PROJECT_NAME }}_Standalone --config ${{ matrix.build_type }}

      - name: Build AU (MacOS)
        working-directory: ./${{ env.PROJECT_NAME }}
        if: matrix.os == 'macos-latest'
        run: >
          cmake --build build --target ${{ env.PROJECT_NAME }}_AU --config ${{ matrix.build_type }}

      - name: Package (Windows)
        working-directory: ./${{ env.PROJECT_NAME }}
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p package
          cp -R build/core/${{ env.PROJECT_NAME }}_artefacts/Release/VST3/${{ env.PROJECT_NAME }}.vst3 package/
          cp -R build/core/${{ env.PROJECT_NAME }}_artefacts/Release/Standalone/${{ env.PROJECT_NAME }}.exe package/
        shell: bash

      - name: Package (MacOS)
        working-directory: ./${{ env.PROJECT_NAME }}
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p package
          cp -R build/core/${{ env.PROJECT_NAME }}_artefacts/Release/VST3/${{ env.PROJECT_NAME }}.vst3 package/
          cp -R build/core/${{ env.PROJECT_NAME }}_artefacts/Release/Standalone/${{ env.PROJECT_NAME }}.app package/
          cp -R build/core/${{ env.PROJECT_NAME }}_artefacts/Release/AU/${{ env.PROJECT_NAME }}.component package/
        shell: bash

      - name: Sign and notarize (macOS)
        working-directory: ./${{ env.PROJECT_NAME }}
        if: matrix.os == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID_NAME: ${{ secrets.DEVELOPER_ID_NAME }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          VST3_PATH="package/${{ env.PROJECT_NAME }}.vst3"
          AU_PATH="package/${{ env.PROJECT_NAME }}.component"
          STANDALONE_PATH="package/${{ env.PROJECT_NAME }}.app"

          echo "Signing..."
          codesign --force --deep --options runtime \
            --sign "Developer ID Application: ${{ env.DEVELOPER_ID_NAME }} (${{ env.APPLE_TEAM_ID }})" \
            "$VST3_PATH"

          codesign --force --deep --options runtime \
            --sign "Developer ID Application: ${{ env.DEVELOPER_ID_NAME }} (${{ env.APPLE_TEAM_ID }})" \
            "$AU_PATH"

          codesign --force --deep --options runtime \
            --sign "Developer ID Application: ${{ env.DEVELOPER_ID_NAME }} (${{ env.APPLE_TEAM_ID }})" \
            "$STANDALONE_PATH"

          echo "Zipping for notarization..."
          ditto -c -k --keepParent "$VST3_PATH" ${{ env.PROJECT_NAME }}-vst3.zip
          ditto -c -k --keepParent "$AU_PATH" ${{ env.PROJECT_NAME }}-au.zip
          ditto -c -k --keepParent "$STANDALONE_PATH" ${{ env.PROJECT_NAME }}-standalone.zip

          echo "Submitting for notarization..."
          xcrun notarytool submit ${{ env.PROJECT_NAME }}-vst3.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          xcrun notarytool submit ${{ env.PROJECT_NAME }}-au.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          xcrun notarytool submit ${{ env.PROJECT_NAME }}-standalone.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          echo "Stapling..."
          xcrun stapler staple "$VST3_PATH"
          xcrun stapler staple "$AU_PATH"
          xcrun stapler staple "$STANDALONE_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.os }}
          path: ${{ env.PROJECT_NAME }}/package/*

  build-linux:
    # Ubuntu 20.04 gives us an intentionally old glibc/libstdc++ baseline,
    # improving compatibility with modern Debian/Ubuntu/Fedora/openSUSE.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Build Linux VST3 (Ubuntu 20.04 compatibility baseline)
        working-directory: ./${{ env.PROJECT_NAME }}
        shell: bash
        run: |
          set -euxo pipefail

          docker pull ubuntu:20.04

          docker run --rm \
            --network host \
            -e DEBIAN_FRONTEND=noninteractive \
            -e VERSION="${{ github.event.inputs.tag }}" \
            -e VERSION_TYPE="${{ github.event.inputs.version_type }}" \
            -v "$GITHUB_WORKSPACE/${{ env.PROJECT_NAME }}:/src" \
            -w /src \
            ubuntu:20.04 \
            bash -lc '
              set -euxo pipefail

              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates \
                build-essential \
                cmake \
                ninja-build \
                pkg-config \
                git \
                python3 \
                libasound2-dev \
                libfontconfig1-dev \
                libfreetype6-dev \
                libgl1-mesa-dev \
                libglu1-mesa-dev \
                libx11-dev \
                libx11-xcb-dev \
                libxcomposite-dev \
                libxcursor-dev \
                libxext-dev \
                libxfixes-dev \
                libxi-dev \
                libxinerama-dev \
                libxrandr-dev \
                libxrender-dev \
                libxcb1-dev

              cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=gcc \
                -DCMAKE_CXX_COMPILER=g++ \
                -DVERSION="$VERSION" \
                -DVERSION_TYPE="$VERSION_TYPE"

              cmake --build build --target "${{ env.PROJECT_NAME }}_VST3" --config Release

              mkdir -p package
              cp -R \
                "build/core/${{ env.PROJECT_NAME }}_artefacts/Release/VST3/${{ env.PROJECT_NAME }}.vst3" \
                package/
            '

      - name: Verify Linux VST3
        working-directory: ./${{ env.PROJECT_NAME }}
        shell: bash
        run: |
          set -euxo pipefail
          test -d "package/${{ env.PROJECT_NAME }}.vst3"
          test -f "package/${{ env.PROJECT_NAME }}.vst3/Contents/x86_64-linux/${{ env.PROJECT_NAME }}.so"

          echo "Linux VST3 dependencies:"
          ldd "package/${{ env.PROJECT_NAME }}.vst3/Contents/x86_64-linux/${{ env.PROJECT_NAME }}.so" || true

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-linux
          path: ${{ env.PROJECT_NAME }}/package/${{ env.PROJECT_NAME }}.vst3
          
  attach-release:
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist

      # Zip all folders
      - name: Zip VST3 folders
        shell: bash
        run: |
          mkdir -p zips
          (
            cd "./dist/plugin-windows-latest" || exit 1
            zip -r "../../zips/${{ env.PROJECT_NAME }}-vst3-windows-${{ github.event.inputs.tag }}${{ github.event.inputs.version_type == 'DEMO' && '-demo' || '' }}.zip" "${{ env.PROJECT_NAME }}.vst3"
          )
          (
            cd "./dist/plugin-windows-latest" || exit 1
            zip -r "../../zips/${{ env.PROJECT_NAME }}-standalone-windows-${{ github.event.inputs.tag }}${{ github.event.inputs.version_type == 'DEMO' && '-demo' || '' }}.zip" "${{ env.PROJECT_NAME }}.exe"
          )
          (
            cd "./dist/plugin-macos-latest" || exit 1
            zip -r "../../zips/${{ env.PROJECT_NAME }}-vst3-macos-${{ github.event.inputs.tag }}${{ github.event.inputs.version_type == 'DEMO' && '-demo' || '' }}.zip" "${{ env.PROJECT_NAME }}.vst3"
          )
          (
            cd "./dist/plugin-macos-latest" || exit 1
            zip -r "../../zips/${{ env.PROJECT_NAME }}-au-macos-${{ github.event.inputs.tag }}${{ github.event.inputs.version_type == 'DEMO' && '-demo' || '' }}.zip" "${{ env.PROJECT_NAME }}.component"
          )
          (
            cd "./dist/plugin-macos-latest" || exit 1
            zip -r "../../zips/${{ env.PROJECT_NAME }}-standalone-macos-${{ github.event.inputs.tag }}${{ github.event.inputs.version_type == 'DEMO' && '-demo' || '' }}.zip" "${{ env.PROJECT_NAME }}.app"
          )
          (
            cd "./dist/plugin-linux" || exit 1
            zip -r "../../zips/${{ env.PROJECT_NAME }}-vst3-linux-${{ github.event.inputs.tag }}${{ github.event.inputs.version_type == 'DEMO' && '-demo' || '' }}.zip" "${{ env.PROJECT_NAME }}.vst3"
          )
   
      # Create the release
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag }}${{ github.event.inputs.version_type == 'DEMO' && '-demo' || '' }}
          RELEASE_NAME: Release ${{ github.event.inputs.tag }}
        run: gh release create "$TAG_NAME" --title="$RELEASE_NAME"

      # Upload zip files to the release
      - name: Upload release assets
        run: gh release upload "${{ github.event.inputs.tag }}${{ github.event.inputs.version_type == 'DEMO' && '-demo' || '' }}" ./zips/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}